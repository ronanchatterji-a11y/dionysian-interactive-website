<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quitlette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #000000; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-text-size-adjust: 100%;
    }
    .icon {
      width: 200px;
      aspect-ratio: 640 / 648;
      border-radius: 24%;
      overflow: hidden;
    }
    .icon img { display: block; width: 100%; height: 100%; }
    h1 {
      margin: 35px 0 30px;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 60px;
      line-height: 1.1;
      letter-spacing: 0;
      color: #FFFFFF;
      text-shadow: none;
    }
    .badge {
      display: block;
      padding: 15px;
      line-height: 0;
    }
    .badge img { display: block; width: 250px; height: auto; }
  </style>
</head>
<body>
  <div class="icon"><img src="../assets/quitletteappicon.jpg" alt="Quitlette app icon"></div>
  <h1>Quitlette</h1>
  <a class="badge" href="https://apps.apple.com/us/app/quitlette-wager-your-pouches/id6802583308">
    <img src="../assets/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg" alt="Download on the App Store">
  </a>
</body>
</html>
